name: pim-32 CI

on: [push, pull_request]

env:
  toolchain-version: 11.3.rel1
  python-version: "3.13"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.python-version }}

      # Pinned: --preview style changes between Black releases
      - uses: psf/black@26.10.1
        with:
          options: --check --diff --preview
          src: scripts
          version: "26.10.1"

      - uses: isort/isort-action@v1.1.1
        with:
            sortPaths: scripts

      - uses: py-actions/flake8@v2.3.0
        with:
          path: scripts

      - uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: scripts

  build:
    runs-on: ubuntu-latest
    name: build-${{ matrix.board }}
    strategy:
      fail-fast: false
      matrix:
        board: [pi2, pi3-64, pi4-64]
        package: [true]
        # 32-bit Pi 3/4 kernels aren't shipped (config.txt boots the 64-bit
        # ones), but build them so the 32-bit targets keep compiling.
        include:
          - board: pi3
            package: false
          - board: pi4
            package: false
    steps:
    - uses: actions/checkout@v7

    - name: Fetch submodules
      run: make submodules

    # FluidSynth's CMake requires host glib via pkg-config even though the
    # Circle patch removes all glib usage; older runner images preinstalled it.
    # newlib 4.5.0 (circle-stdlib v21) builds libgloss docs and needs makeinfo.
    - name: Install host build dependencies
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libglib2.0-dev pkg-config texinfo

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2.24
      with:
        key: ${{ env.toolchain-version }}-${{ matrix.board }}

    - name: Cache ARM toolchains
      id: cache-toolchains
      uses: actions/cache@v6
      with:
        path: |
          ~/arm-gnu-toolchain-${{ env.toolchain-version }}-x86_64-arm-none-eabi
          ~/arm-gnu-toolchain-${{ env.toolchain-version }}-x86_64-aarch64-none-elf
        key: cache-arm-toolchains-${{ env.toolchain-version }}

    - name: Install toolchains if not retrieved from cache
      if: steps.cache-toolchains.outputs.cache-hit != 'true'
      run: |
        for triplet in arm-none-eabi aarch64-none-elf; do
          wget -q https://developer.arm.com/-/media/Files/downloads/gnu/${{ env.toolchain-version }}/binrel/arm-gnu-toolchain-${{ env.toolchain-version }}-x86_64-${triplet}.tar.xz
          tar -xf arm-gnu-toolchain-${{ env.toolchain-version }}-x86_64-${triplet}.tar.xz -C ~
          rm arm-gnu-toolchain-${{ env.toolchain-version }}-x86_64-${triplet}.tar.xz
        done

    - name: Update PATH
      run: |
        mkdir ~/ccache_bin
        for triplet in arm-none-eabi aarch64-none-elf; do
          ln -s $(which ccache) ~/ccache_bin/${triplet}-gcc
          ln -s $(which ccache) ~/ccache_bin/${triplet}-g++
          echo "$HOME/ccache_bin:$HOME/arm-gnu-toolchain-${{ env.toolchain-version }}-x86_64-${triplet}/bin" >> $GITHUB_PATH
        done

    - name: Build
      run: make -j BOARD=${{ matrix.board }}

    - name: Upload built kernel
      if: matrix.package
      uses: actions/upload-artifact@v7
      with:
        name: kernels-${{ matrix.board }}
        path: kernel*.img

    - name: Build (HDMI console)
      if: matrix.package
      run: make clean && make -j BOARD=${{ matrix.board }} HDMI_CONSOLE=1

    - name: Upload built kernel (HDMI console)
      if: matrix.package
      uses: actions/upload-artifact@v7
      with:
        name: kernels-hdmi-${{ matrix.board }}
        path: kernel*.img

  package:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # GeneralUser GS v2.0.3 (docs r6), pinned by commit; update checksums when bumping
      gugs-commit: 684543d5e5efaef08d02be50dcda8d552478fa60
      boot-home: external/circle-stdlib/libs/circle/boot
      wlan-home: external/circle-stdlib/libs/circle/addon/wlan

    steps:
    - uses: actions/checkout@v7

    - name: Fetch submodules
      run: make submodules

    - name: Cache boot files
      id: cache-boot-files
      uses: actions/cache@v6
      with:
        path: |
          sdcard/armstub8-rpi4.bin
          sdcard/bcm2711-rpi-4-b.dtb
          sdcard/bcm2711-rpi-400.dtb
          sdcard/bcm2711-rpi-cm4.dtb
          sdcard/bootcode.bin
          sdcard/COPYING.linux
          sdcard/fixup_cd.dat
          sdcard/fixup4cd.dat
          sdcard/LICENCE.broadcom
          sdcard/start_cd.elf
          sdcard/start4cd.elf
        key: cache-boot-files-${{ hashFiles(join(env.boot-home, '/Makefile')) }}

    - name: Cache WLAN firmware
      id: cache-wlan-firmware
      uses: actions/cache@v6
      with:
        path: sdcard/firmware
        key: cache-wlan-firmware-${{ hashFiles(join(env.wlan-home, '/firmware/Makefile')) }}

    - name: Cache ARM toolchains
      if: steps.cache-boot-files.outputs.cache-hit != 'true'
      uses: actions/cache@v6
      with:
        path: |
          ~/arm-gnu-toolchain-${{ env.toolchain-version }}-x86_64-arm-none-eabi
          ~/arm-gnu-toolchain-${{ env.toolchain-version }}-x86_64-aarch64-none-elf
        key: cache-arm-toolchains-${{ env.toolchain-version }}

    - name: Update PATH
      if: steps.cache-boot-files.outputs.cache-hit != 'true'
      run: |
        for triplet in arm-none-eabi aarch64-none-elf; do
          echo "$HOME/arm-gnu-toolchain-${{ env.toolchain-version }}-x86_64-${triplet}/bin" >> $GITHUB_PATH
        done

    - name: Download boot files and build ARM stub if not retrieved from cache
      if: steps.cache-boot-files.outputs.cache-hit != 'true'
      run: |
        make -C ${{ env.boot-home }} firmware armstub64
        cp  ${{ env.boot-home }}/armstub8-rpi4.bin \
            ${{ env.boot-home }}/bcm2711-rpi-4-b.dtb \
            ${{ env.boot-home }}/bcm2711-rpi-400.dtb \
            ${{ env.boot-home }}/bcm2711-rpi-cm4.dtb \
            ${{ env.boot-home }}/bootcode.bin \
            ${{ env.boot-home }}/COPYING.linux \
            ${{ env.boot-home }}/fixup_cd.dat \
            ${{ env.boot-home }}/fixup4cd.dat \
            ${{ env.boot-home }}/LICENCE.broadcom \
            ${{ env.boot-home }}/start_cd.elf \
            ${{ env.boot-home }}/start4cd.elf \
            sdcard

    - name: Download WLAN firmware if not retrieved from cache
      if: steps.cache-wlan-firmware.outputs.cache-hit != 'true'
      run: |
        mkdir -p sdcard/firmware
        make -C ${{ env.wlan-home }}/firmware
        # Since Circle Step 50 the firmware comes from RPi-Distro/firmware-nonfree's
        # debian/config/brcm80211 tree, which has no standalone licence file; its
        # licence terms are in debian/copyright at the same commit.
        fw_commit=$(sed -n 's/^FIRMWARE ?= //p' ${{ env.wlan-home }}/firmware/Makefile)
        curl -fsSL -o sdcard/firmware/LICENCE.firmware-nonfree \
            "https://raw.githubusercontent.com/RPi-Distro/firmware-nonfree/${fw_commit}/debian/copyright"
        cp  ${{ env.wlan-home }}/firmware/brcmfmac43430-sdio.bin \
            ${{ env.wlan-home }}/firmware/brcmfmac43430-sdio.txt \
            ${{ env.wlan-home }}/firmware/brcmfmac43430-sdio.clm_blob \
            ${{ env.wlan-home }}/firmware/brcmfmac43436-sdio.bin \
            ${{ env.wlan-home }}/firmware/brcmfmac43436-sdio.txt \
            ${{ env.wlan-home }}/firmware/brcmfmac43436-sdio.clm_blob \
            ${{ env.wlan-home }}/firmware/brcmfmac43455-sdio.bin \
            ${{ env.wlan-home }}/firmware/brcmfmac43455-sdio.txt \
            ${{ env.wlan-home }}/firmware/brcmfmac43455-sdio.clm_blob \
            ${{ env.wlan-home }}/firmware/brcmfmac43456-sdio.bin \
            ${{ env.wlan-home }}/firmware/brcmfmac43456-sdio.txt \
            ${{ env.wlan-home }}/firmware/brcmfmac43456-sdio.clm_blob \
            sdcard/firmware

    - name: Cache GeneralUser GS SoundFont
      id: cache-generaluser-gs
      uses: actions/cache@v6
      with:
        path: generaluser-gs
        key: cache-generaluser-gs-${{ env.gugs-commit }}

    - name: Download GeneralUser GS SoundFont if not retrieved from cache
      if: steps.cache-generaluser-gs.outputs.cache-hit != 'true'
      run: |
        mkdir -p generaluser-gs
        base="https://raw.githubusercontent.com/mrbumpy409/GeneralUser-GS/${{ env.gugs-commit }}"
        curl -fsSL -o "generaluser-gs/GeneralUser-GS.sf2" "$base/GeneralUser-GS.sf2"
        curl -fsSL -o "generaluser-gs/CHANGELOG.md" "$base/documentation/CHANGELOG.md"
        curl -fsSL -o "generaluser-gs/LICENSE.txt" "$base/documentation/LICENSE.txt"
        cat > generaluser-gs.sha256 <<'SUMS'
        9575028c7a1f589f5770fccc8cff2734566af40cd26ed836944e9a5152688cfe  generaluser-gs/GeneralUser-GS.sf2
        2ed3138c31d43c8a36e106703679e3ec88bf579da7c34051bd9531ec08939b44  generaluser-gs/CHANGELOG.md
        7b32efefdf95ce38a043799f0659853ddc00fbaa14d8c50f0aca16b9b8b405be  generaluser-gs/LICENSE.txt
        SUMS
        sha256sum -c generaluser-gs.sha256

    - name: Retrieve built kernels
      uses: actions/download-artifact@v8
      with:
        pattern: kernels-pi*
        merge-multiple: true
        path: sdcard

    - name: Add extra files to SD card directory
      run: |
        mkdir sdcard/docs
        cp generaluser-gs/GeneralUser-GS.sf2 "sdcard/soundfonts/GeneralUser GS v2.0.3.sf2"
        cp generaluser-gs/CHANGELOG.md sdcard/docs/CHANGELOG.GeneralUserGS
        cp generaluser-gs/LICENSE.txt sdcard/docs/LICENSE.GeneralUserGS
        cp LICENSE sdcard/docs
        cp README.md sdcard/docs

    - name: Upload SD card archive
      uses: actions/upload-artifact@v7
      with:
        name: sdcard
        path: sdcard

    - name: Get version (git tag)
      if: startsWith(github.ref, 'refs/tags/v')
      id: get_version
      run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

    - name: Create release package
      if: startsWith(github.ref, 'refs/tags/v')
      run: cd sdcard; zip -r ../pim-32-${{ steps.get_version.outputs.version }}.zip *

    - name: Extract release notes from CHANGELOG
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        VERSION: ${{ steps.get_version.outputs.version }}
      run: |
        awk -v ver="$VERSION" '
          /^## \[/ { if (found) exit; if (index($0, "## [" ver "]") == 1) { found = 1; next } }
          found
        ' CHANGELOG.md > release-notes.md
        if ! grep -q '[^[:space:]]' release-notes.md; then
          echo "No CHANGELOG.md entry found for version $VERSION" >&2
          exit 1
        fi
        cat release-notes.md

    - name: Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v3
      with:
        name: pim-32 v${{ steps.get_version.outputs.version }}
        body_path: release-notes.md
        files: pim-32-*.zip
