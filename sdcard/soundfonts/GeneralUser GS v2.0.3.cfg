# Recommended FluidSynth effects settings for GeneralUser GS v2.0.3, from
# the author's documentation (section 3.0.2):
# https://github.com/mrbumpy409/GeneralUser-GS/blob/main/documentation/README.md
#
# This file applies only to a SoundFont with the same file name. If you
# rename the .sf2, rename this file to match.

# mt32-pi's output level for this SoundFont (unchanged from previous releases)
gain = 0.2

reverb = on
reverb_damping = 0.3
reverb_level = 0.7
reverb_room_size = 0.5
reverb_width = 0.8

chorus = on
chorus_depth = 3.6
chorus_level = 0.55
chorus_voices = 4
chorus_speed = 0.36
